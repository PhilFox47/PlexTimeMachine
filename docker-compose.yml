services:
  plex-time-machine:
    build: .
    image: plex-time-machine:latest
    container_name: plex-time-machine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Innerhalb des Containers liegt die Datenbank immer im Volume.
      PTM_DATABASE_URL: sqlite:////app/data/plex_time_machine.db
    ports:
      - "8088:8080"
    volumes:
      - ./data:/app/data
